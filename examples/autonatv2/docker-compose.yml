services:
    autonatv2:
        build:
            context: ../..
            dockerfile: examples/autonatv2/Dockerfile
        environment:
            # The jaeger feature exports OTLP/HTTP, not the deprecated UDP agent protocol.
            OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
        ports:
            - 4884:4884
    jaeger:
        image: jaegertracing/all-in-one
        environment:
            COLLECTOR_OTLP_ENABLED: "true"
        ports:
            - 4318:4318
            - 16686:16686
            - 14268:14268
